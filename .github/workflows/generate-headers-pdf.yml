name: Generate C++ Headers PDF

on:
  push:
    branches: [master]
    paths:
      - '*.hpp'
      - '.github/scripts/headers.py'
      - '.github/scripts/publish_headers.cjs'
      - '.github/workflows/generate-headers-pdf.yml'
  pull_request:
    paths:
      - '*.hpp'
      - '.github/scripts/headers.py'
      - '.github/scripts/publish_headers.cjs'
      - '.github/workflows/generate-headers-pdf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: headers-pdf-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build_pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PDF toolchain
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends \
            pandoc texlive-xetex texlive-latex-extra texlive-lang-chinese \
            texlive-fonts-recommended lmodern fonts-noto-cjk fonts-dejavu-core
          kpsewhich lmodern.sty
          kpsewhich xeCJK.sty
          kpsewhich fvextra.sty
          kpsewhich pzdr.tfm
      - name: Build PDF without modifying headers
        run: python3 .github/scripts/headers.py build --output build/headers.pdf
      - name: Verify reproducible PDF on PRs
        if: github.event_name == 'pull_request'
        run: |
          python3 .github/scripts/headers.py build --output "$RUNNER_TEMP/headers-rebuilt.pdf"
          cmp build/headers.pdf "$RUNNER_TEMP/headers-rebuilt.pdf"
      - name: Confirm source checkout is unchanged
        run: git diff --exit-code
      - name: Save PDF for review or publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headers-pdf
          path: build/headers.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    needs: build_pdf
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: headers-pdf
          path: ${{ runner.temp }}/headers
      - name: Commit only if source inputs are still current
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PDF_PATH: ${{ runner.temp }}/headers/headers.pdf
        with:
          script: |
            await require('./.github/scripts/publish_headers.cjs').publish({ github, context, core });
