name: Update OI-Wiki PDF

on:
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['.github/workflows/update-oi-wiki.yml', '.github/scripts/oi_wiki.cjs']
  pull_request:
    paths: ['.github/workflows/update-oi-wiki.yml', '.github/scripts/oi_wiki.cjs']

permissions:
  contents: read

concurrency:
  group: oi-wiki-pdf-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      digest: ${{ steps.verify.outputs.digest }}
      source_url: ${{ steps.upstream.outputs.source_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare upstream and mirrored release metadata
        id: upstream
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          retries: 3
          script: |
            await require('./.github/scripts/oi_wiki.cjs').inspect({ github, context, core });
      # PR/manual runs always exercise a real download, even when already current.
      - name: Download OI-wiki.pdf when needed
        if: >-
          steps.upstream.outputs.changed == 'true' ||
          github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        env:
          ASSET_URL: ${{ steps.upstream.outputs.url }}
        run: |
          curl --fail --location --show-error --silent --proto '=https' \
            --retry 3 --connect-timeout 30 --max-time 300 \
            "$ASSET_URL" -o "$RUNNER_TEMP/OI-wiki.pdf"
      - name: Verify PDF signature, size and SHA-256
        id: verify
        if: >-
          steps.upstream.outputs.changed == 'true' ||
          github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          EXPECTED_SIZE: ${{ steps.upstream.outputs.size }}
          EXPECTED_DIGEST: ${{ steps.upstream.outputs.digest }}
        with:
          script: |
            const path = require('node:path');
            const digest = await require('./.github/scripts/oi_wiki.cjs').verify(
              path.join(process.env.RUNNER_TEMP, 'OI-wiki.pdf'),
              process.env.EXPECTED_SIZE, process.env.EXPECTED_DIGEST
            );
            core.setOutput('digest', digest);
            core.info(`Verified OI-wiki.pdf: ${digest}`);
      - name: Transfer verified PDF to the publisher
        if: >-
          steps.upstream.outputs.changed == 'true' && github.event_name != 'pull_request' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oi-wiki-pdf
          path: ${{ runner.temp }}/OI-wiki.pdf
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: check
    if: >-
      needs.check.outputs.changed == 'true' && github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: oi-wiki-pdf
          path: ${{ runner.temp }}
      - name: Publish the verified release asset
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PDF_DIGEST: ${{ needs.check.outputs.digest }}
          SOURCE_RELEASE_URL: ${{ needs.check.outputs.source_url }}
        with:
          retries: 3
          script: |
            await require('./.github/scripts/oi_wiki.cjs').publish({ github, context, core });
