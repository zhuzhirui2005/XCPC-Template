name: Daily C++ Compile Check

on:
  schedule:
    # 每天 UTC 0 点触发一次，按需改成你想要的时间
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Inject headers and namespace, then compile
        shell: bash
        run: |
          # 1) 在 Header.hpp 开头插入依赖
          sed -i '1iusing namespace std;' Header.hpp
          sed -i '1i#include <bits/stdc++.h>' Header.hpp
          sed -i '1i#pragma once' Header.hpp

          # 2) 对其它所有 .hpp 文件插入依赖
          deps=(
            "modint.hpp:数论.hpp"
            "矩阵.hpp:数论.hpp"
            "数论.hpp:图论.hpp"
            "并查集.hpp:图论.hpp"
            "数论.hpp:poly.hpp"
            "poly.hpp:字符串.hpp"
            "离散化.hpp:字符串.hpp"
            "RMQ.hpp:字符串.hpp"
            "树状数组.hpp:vector.hpp"
            "离散化.hpp:树.hpp"
            "dq.hpp:杂项.hpp"
          )
          for pair in "${deps[@]}"; do
            IFS=: read -r dep target <<< "$pair"
            sed -i "1i#include \"${dep}\"" "$target"
          done

          for f in *.hpp; do
            if [[ "$f" != "Header.hpp" ]]; then
              sed -i '1i#include "Header.hpp"' "$f"
            fi
          done

          # 3) 尝试编译每个文件（若有工程文件可以改成编译整个工程）
          for f in *.hpp; do
            echo "Compiling $f..."
            g++ -std=c++20 -O2 -Wall -Wextra -fsyntax-only "$f"
          done

      - name: Revert all local modifications
        run: git checkout -- .