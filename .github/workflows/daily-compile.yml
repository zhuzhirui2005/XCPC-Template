name: Daily C++ Compile Check

on:
  schedule:
    # 每天 UTC 0 点触发一次，按需改成你想要的时间
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Inject headers and namespace, then compile
        shell: bash
        run: |
          # 1) 在 Header.hpp 开头插入依赖
          header_prefix=$'#pragma once\n#include <bits/stdc++.h>\nusing namespace std;\n'
          tmp=$(mktemp)
          printf '%b' "$header_prefix" > "$tmp"
          cat Header.hpp >> "$tmp"
          mv "$tmp" Header.hpp

          # 2) 对其它所有 .hpp 文件插入依赖
          common_prefix=$'#pragma once\n#include <bits/stdc++.h>\n#include "Header.hpp"\nusing namespace std;\n'
          readarray -t headers < <(printf '%s\n' *.hpp)

          for f in "${headers[@]}"; do
            [[ "$f" == "Header.hpp" ]] && continue

            prefix="$common_prefix"
            for dep in "${headers[@]}"; do
              [[ "$dep" == "Header.hpp" || "$dep" == "$f" ]] && continue
              prefix+="#include \"$dep\"\n"
            done

            tmp=$(mktemp)
            printf '%b' "$prefix" > "$tmp"
            cat "$f" >> "$tmp"
            mv "$tmp" "$f"
          done

          # 3) 尝试编译每个文件（若有工程文件可以改成编译整个工程）
          for f in *.hpp; do
            echo "Compiling $f..."
            g++ -std=c++17 -O2 -Wall -Wextra -fsyntax-only "$f"
          done

      - name: Revert all local modifications
        run: git checkout -- .