name: C++20 and Workflow Checks

on:
  push:
    branches: [master]
    paths: ['*.hpp', '.github/**']
  pull_request:
    paths: ['*.hpp', '.github/**']
  # A weekly check catches runner/toolchain drift without daily no-op runs.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  tooling:
    name: Workflow lint and regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Test header preparation and PDF generation inputs
        run: python3 -m unittest discover -s .github/tests -p 'test_*.py' -v
      - name: Test download verification and publication safeguards
        run: node --test .github/tests/*.cjs

  compile:
    name: C++20 (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++-13, g++-14]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check every header in an isolated temporary directory
        env:
          CXX: ${{ matrix.compiler }}
        run: python3 .github/scripts/headers.py check --jobs 2
      - name: Confirm source checkout is unchanged
        if: always()
        run: git diff --exit-code
